[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calpuff-dispersion-matrix"
version = "0.1.0"
description = "Formal CALMET/CALPUFF/CALPOST concentration-transfer matrix workflow"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
visualization = ["matplotlib>=3.7", "imageio>=2.31"]
partition = ["matplotlib>=3.7", "requests>=2.31", "pyshp>=3.0"]

[project.scripts]
calpuff-matrix = "calpuff_matrix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "outputs", "runs", "official_calpuff/*/runs", "official_calpuff/*/outputs", "archive"]

[tool.ruff]
exclude = ["archive", "tools"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
